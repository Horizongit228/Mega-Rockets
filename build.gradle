plugins {
    id 'fabric-loom' version '1.7.4'
}
version = project.mod_version
group = project.maven_group
base { archivesName = 'mega-rockets' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

// NASA satellite mosaics are downloaded and transformed at build time, never in the game.
def planetResources = layout.buildDirectory.dir('generated/planetResources')
sourceSets.main.resources.srcDir(planetResources)
tasks.register('preparePlanetTextures', Exec) {
    inputs.file('tools/PlanetTextures.java')
    outputs.dir(planetResources)
    commandLine 'java', 'tools/PlanetTextures.java', planetResources.get().asFile.absolutePath
}
tasks.named('processResources') { dependsOn tasks.named('preparePlanetTextures') }

name: Build Mega Rockets
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Check rocket geometry
        run: |
          javac -d mesh-check src/main/java/dev/megarockets/client/TitanMesh.java src/main/java/dev/megarockets/client/RocketModels.java checks/MeshCheck.java checks/RocketModelsCheck.java
          java -cp mesh-check MeshCheck
          java -cp mesh-check RocketModelsCheck
      - name: Check flight profile
        run: |
          javac -d mesh-check src/main/java/dev/megarockets/FlightProfile.java checks/FlightCheck.java
          java -cp mesh-check FlightCheck
      - name: Check lunar mission
        run: |
          javac -d mesh-check src/main/java/dev/megarockets/LunarFlight.java checks/LunarFlightCheck.java
          java -cp mesh-check LunarFlightCheck
      - name: Check Moon terrain
        run: |
          javac src/main/java/dev/megarockets/PlanetWrap.java -d mesh-check src/main/java/dev/megarockets/PlanetCaves.java src/main/java/dev/megarockets/MoonTerrain.java checks/MoonTerrainCheck.java
          java -cp mesh-check MoonTerrainCheck
      - name: Check interplanetary missions
        run: |
          javac src/main/java/dev/megarockets/PlanetWrap.java -d mesh-check src/main/java/dev/megarockets/LunarFlight.java src/main/java/dev/megarockets/FlightProfile.java src/main/java/dev/megarockets/PlanetCaves.java src/main/java/dev/megarockets/MarsTerrain.java checks/InterplanetaryCheck.java
          java -cp mesh-check InterplanetaryCheck
      - name: Check caves and Martian mountains
        run: |
          javac src/main/java/dev/megarockets/PlanetWrap.java -d mesh-check src/main/java/dev/megarockets/PlanetCaves.java src/main/java/dev/megarockets/MoonTerrain.java src/main/java/dev/megarockets/MarsTerrain.java checks/PlanetGeologyCheck.java
          java -cp mesh-check PlanetGeologyCheck
      - name: Check oxygen rules
        run: |
          javac -d mesh-check src/main/java/dev/megarockets/OxygenRules.java checks/OxygenCheck.java
          java -cp mesh-check OxygenCheck
      - name: Check natural landing survey
        run: |
          javac src/main/java/dev/megarockets/PlanetWrap.java -d mesh-check src/main/java/dev/megarockets/PlanetCaves.java src/main/java/dev/megarockets/MoonTerrain.java src/main/java/dev/megarockets/MarsTerrain.java src/main/java/dev/megarockets/LandingSurvey.java checks/LandingSurveyCheck.java
          java -cp mesh-check LandingSurveyCheck
      - name: Check expanded solar system
        run: |
          javac src/main/java/dev/megarockets/PlanetWrap.java -d mesh-check src/main/java/dev/megarockets/PlanetCaves.java src/main/java/dev/megarockets/MoonTerrain.java src/main/java/dev/megarockets/MarsTerrain.java src/main/java/dev/megarockets/SolarScale.java src/main/java/dev/megarockets/Destination.java src/main/java/dev/megarockets/OuterPlanetTerrain.java src/main/java/dev/megarockets/LunarFlight.java src/main/java/dev/megarockets/LandingSurvey.java checks/UniverseCheck.java
          java -cp mesh-check UniverseCheck
      - name: Check manual rocket controls
        run: |
          javac -d mesh-check src/main/java/dev/megarockets/ManualFlight.java checks/ManualFlightCheck.java
          java -cp mesh-check ManualFlightCheck
      - name: Check cockpit systems and orbital navigation
        run: |
          javac -d mesh-check src/main/java/dev/megarockets/CabinSystems.java src/main/java/dev/megarockets/ManualFlight.java checks/CabinSystemsCheck.java
          java -cp mesh-check CabinSystemsCheck
      - name: Check direct entry and landing rules
        run: |
          javac -d mesh-check src/main/java/dev/megarockets/ApproachRules.java checks/ApproachCheck.java
          java -cp mesh-check ApproachCheck
      - name: Check living solar system
        run: |
          javac src/main/java/dev/megarockets/PlanetWrap.java -d mesh-check src/main/java/dev/megarockets/PlanetCaves.java src/main/java/dev/megarockets/MoonTerrain.java src/main/java/dev/megarockets/MarsTerrain.java src/main/java/dev/megarockets/SolarScale.java src/main/java/dev/megarockets/Destination.java src/main/java/dev/megarockets/SolarDynamics.java src/main/java/dev/megarockets/AsteroidTerrain.java src/main/java/dev/megarockets/ManualFlight.java checks/SolarDynamicsCheck.java
          java -cp mesh-check SolarDynamicsCheck
      - name: Check orbital station
        run: |
          javac -d mesh-check src/main/java/dev/megarockets/StationLayout.java checks/StationCheck.java
          java -cp mesh-check StationCheck
      - name: Check lunar village
        run: |
          javac src/main/java/dev/megarockets/PlanetWrap.java -d mesh-check src/main/java/dev/megarockets/PlanetCaves.java src/main/java/dev/megarockets/MoonTerrain.java src/main/java/dev/megarockets/LunarVillageLayout.java src/main/java/dev/megarockets/LunarSettlements.java checks/LunarVillageCheck.java
          java -cp mesh-check LunarVillageCheck
      - name: Check solar energy
        run: |
          javac -d mesh-check src/main/java/dev/megarockets/EnergyRules.java checks/EnergyCheck.java
          java -cp mesh-check EnergyCheck
      - name: Check flat periodic surfaces
        run: |
          javac -d mesh-check src/main/java/dev/megarockets/PlanetWrap.java src/main/java/dev/megarockets/PlanetCaves.java src/main/java/dev/megarockets/MoonTerrain.java src/main/java/dev/megarockets/MarsTerrain.java src/main/java/dev/megarockets/SolarScale.java src/main/java/dev/megarockets/Destination.java src/main/java/dev/megarockets/OuterPlanetTerrain.java src/main/java/dev/megarockets/LunarVillageLayout.java checks/PlanetWrapCheck.java
          java -cp mesh-check PlanetWrapCheck
      - name: Check hyperjump geometry
        run: |
          javac -cp mesh-check -d mesh-check src/main/java/dev/megarockets/JumpRules.java checks/JumpCheck.java
          java -cp mesh-check JumpCheck
      - name: Build Fabric mod
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Mega-Rockets-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

name: Build Mega Rockets
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Check rocket geometry
        run: |
          javac -d mesh-check src/main/java/dev/megarockets/client/TitanMesh.java checks/MeshCheck.java
          java -cp mesh-check MeshCheck
      - name: Check flight profile
        run: |
          javac -d mesh-check src/main/java/dev/megarockets/FlightProfile.java checks/FlightCheck.java
          java -cp mesh-check FlightCheck
      - name: Build Fabric mod
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Mega-Rockets-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
